<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
  <style>/*__HIGHLIGHT_CSS__*/</style>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      padding: 24px;
      background: #0b0f17;
      color: #e6edf3;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    .container {
      width: min(98vw, 1800px);
      margin: 0 auto;
    }
    .title {
      margin: 0;
      font-size: 14px;
      color: #9fb3c8;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 12px;
    }
    /* Parameter controls bar */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: #7a8fa6;
    }
    .ctrl-group label {
      user-select: none;
    }
    .ctrl-group select,
    .ctrl-group input[type="text"] {
      background: #111827;
      color: #e6edf3;
      border: 1px solid #2f3a4f;
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.12s;
    }
    .ctrl-group input[type="text"] {
      width: 72px;
      cursor: text;
    }
    .ctrl-group select:hover,
    .ctrl-group input[type="text"]:hover {
      border-color: #4a6080;
    }
    .ctrl-group select:focus,
    .ctrl-group input[type="text"]:focus {
      outline: none;
      border-color: #7cc7ff;
    }
    .ctrl-sep {
      width: 1px;
      height: 14px;
      background: #2f3a4f;
      margin: 0 2px;
      flex-shrink: 0;
    }
    .copy-button {
      border: 1px solid #2f3a4f;
      background: #111827;
      color: #e6edf3;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .copy-button:hover {
      background: #172033;
    }
    .code-link {
      color: #7cc7ff;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    pre {
      margin: 0;
      padding: 18px 20px;
      border-radius: 10px;
      overflow-x: auto;
      border: 1px solid #263041;
      width: 100%;
      box-sizing: border-box;
    }
    code {
      font-size: 14px;
      line-height: 1.55;
      tab-size: 2;
      white-space: pre;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="toolbar">
      <p id="script-title" class="title">{{filename}}</p>
      <button id="copy-script" class="copy-button" type="button">Copy script</button>
    </div>
    <div class="controls">
      <div class="ctrl-group">
        <label for="ctrl-os">os</label>
        <select id="ctrl-os">
          <option value="linux">linux</option>
          <option value="mac">mac</option>
          <option value="windows">windows</option>
          <option value="freebsd">freebsd</option>
          <option value="openbsd">openbsd</option>
          <option value="netbsd">netbsd</option>
        </select>
      </div>
      <div class="ctrl-sep"></div>
      <div class="ctrl-group">
        <label for="ctrl-arch">arch</label>
        <select id="ctrl-arch">
          <option value="amd64">amd64</option>
          <option value="arm64">arm64</option>
          <option value="x86">x86</option>
          <option value="arm">arm</option>
          <option value="mips64le">mips64le</option>
          <option value="mips64">mips64</option>
          <option value="mipsle">mipsle</option>
          <option value="mips">mips</option>
          <option value="ppc64le">ppc64le</option>
          <option value="ppc64">ppc64</option>
          <option value="riscv">riscv</option>
        </select>
      </div>
      <div class="ctrl-sep"></div>
      <div class="ctrl-group">
        <label for="ctrl-version">version</label>
        <input id="ctrl-version" type="text" placeholder="latest" />
      </div>
      <div class="ctrl-sep"></div>
      <div class="ctrl-group">
        <label for="ctrl-method">method</label>
        <select id="ctrl-method">
          <option value="binary">binary</option>
          <option value="installer">installer</option>
        </select>
      </div>
    </div>
    <pre><code id="script-code" class="language-{{language}}">{{code}}</code></pre>
  </div>
  <script>/*__HIGHLIGHT_JS__*/</script>
  <script>
    // -------------------------------------------------------------------------
    // Linkify URLs inside the _urls=( ... ) array in the rendered script.
    // Operates on the highlight.js HTML output so that URLs become clickable
    // without breaking the surrounding syntax colouring.
    // -------------------------------------------------------------------------
    function linkifyUrlsInUrlsLines(highlightedHtml, rawScriptText) {
      const highlightedLines = highlightedHtml.split("\n");
      const rawLines = rawScriptText.split("\n");
      const lineCount = Math.max(highlightedLines.length, rawLines.length);
      let inUrlsBlock = false;

      for (let i = 0; i < lineCount; i += 1) {
        const rawLine = rawLines[i] ?? "";
        const trimmed = rawLine.trim();
        if (trimmed.includes("_urls=(") || trimmed.includes("_urls =(")) {
          inUrlsBlock = true;
          continue;
        }
        if (inUrlsBlock && trimmed === ")") {
          inUrlsBlock = false;
          continue;
        }
        if (!inUrlsBlock) continue;

        highlightedLines[i] = (highlightedLines[i] ?? "").replace(
          /https?:\/\/[^\s<)]+/g,
          (matchedUrl) => {
            const cleanUrl = matchedUrl.replace(/(?:&#x27;|&quot;|['"`])+$/g, "");
            const trailing = matchedUrl.slice(cleanUrl.length);
            return `<a class="code-link" href="${cleanUrl}" target="_blank" rel="noopener noreferrer">${cleanUrl}</a>${trailing}`;
          }
        );
      }

      return highlightedLines.join("\n");
    }

    // -------------------------------------------------------------------------
    // Elements
    // -------------------------------------------------------------------------
    const copyButton  = document.getElementById("copy-script");
    const scriptCode  = document.getElementById("script-code");
    const scriptTitle = document.getElementById("script-title");

    /** @type {{ highlight: (c:string,o:{language:string})=>{value:string}, highlightAuto: (c:string)=>{value:string} } | undefined} */
    const hljsLib = /** @type {any} */ (window)["hljs"];

    // Language is mutable — it changes when the user switches between a
    // non-Windows OS (bash) and Windows (powershell).
    const initialLangClass = [...(scriptCode?.classList ?? [])].find((c) =>
      c.startsWith("language-")
    );
    let language = initialLangClass?.replace("language-", "") ?? "bash";

    // -------------------------------------------------------------------------
    // Rendering
    // -------------------------------------------------------------------------
    function renderScript(rawText) {
      if (!scriptCode) return;
      if (hljsLib) {
        const highlighted = language
          ? hljsLib.highlight(rawText, { language }).value
          : hljsLib.highlightAuto(rawText).value;
        scriptCode.innerHTML = linkifyUrlsInUrlsLines(highlighted, rawText);
      } else {
        scriptCode.textContent = rawText;
      }
    }

    // Render the server-provided script on first load.
    // textContent decodes HTML entities that were escaped server-side.
    renderScript(scriptCode?.textContent ?? "");

    // -------------------------------------------------------------------------
    // Controls — param name → element id mapping
    // -------------------------------------------------------------------------
    /** @type {Array<{ param: string, id: string }>} */
    const CONTROLS = [
      { param: "os",      id: "ctrl-os"      },
      { param: "arch",    id: "ctrl-arch"    },
      { param: "version", id: "ctrl-version" },
      { param: "method",  id: "ctrl-method"  },
    ];

    // Seed controls from the current URL query string.
    function applyParamsToControls(params) {
      for (const { param, id } of CONTROLS) {
        const el = /** @type {HTMLSelectElement|HTMLInputElement|null} */ (
          document.getElementById(id)
        );
        if (!el) continue;
        const val = params.get(param);
        if (val !== null) el.value = val;
      }
      // Ensure the version field shows "latest" when the param is absent.
      const versionEl = document.getElementById("ctrl-version");
      if (versionEl && !params.has("version")) {
        /** @type {HTMLInputElement} */ (versionEl).value = "latest";
      }
    }

    applyParamsToControls(new URLSearchParams(window.location.search));

    // -------------------------------------------------------------------------
    // Reload — fetch the new script and update everything
    // -------------------------------------------------------------------------
    async function reloadScript({ push = true } = {}) {
      // Build the new set of params from the current control values.
      const params = new URLSearchParams(window.location.search);
      params.delete("inline"); // never show inline=true in the displayed URL

      for (const { param, id } of CONTROLS) {
        const el = /** @type {HTMLSelectElement|HTMLInputElement|null} */ (
          document.getElementById(id)
        );
        if (!el) continue;
        const val = el.value.trim();
        if (val) {
          params.set(param, val);
        } else {
          params.delete(param);
        }
      }

      // Update the browser URL so it is shareable.
      const newSearch = params.toString();
      const newUrl = `${window.location.pathname}${newSearch ? "?" + newSearch : ""}`;
      if (push) history.pushState({}, "", newUrl);

      // Update language from the selected OS — must happen before renderScript.
      const osVal = params.get("os") ?? "linux";
      language = osVal === "windows" ? "powershell" : "bash";
      if (scriptCode) scriptCode.className = `language-${language}`;

      // Fetch the raw script text.
      const fetchParams = new URLSearchParams(params);
      fetchParams.set("inline", "true");
      try {
        const res = await fetch(
          `${window.location.pathname}?${fetchParams.toString()}`
        );
        if (!res.ok) {
          const errText = await res.text();
          if (scriptCode) scriptCode.textContent = `Error ${res.status}: ${errText}`;
          return;
        }

        // Update the filename from the Content-Disposition header.
        const disposition = res.headers.get("Content-Disposition");
        const filenameMatch = disposition?.match(/filename="([^"]+)"/);
        const newFilename = filenameMatch?.[1];
        if (newFilename) {
          if (scriptTitle) scriptTitle.textContent = newFilename;
          document.title = newFilename;
        }

        renderScript(await res.text());
      } catch (err) {
        console.error("Failed to reload script:", err);
      }
    }

    // -------------------------------------------------------------------------
    // Event listeners — selects respond to "change"; version input on Enter/blur
    // -------------------------------------------------------------------------
    for (const { id } of CONTROLS) {
      const el = document.getElementById(id);
      if (!el || el.tagName !== "SELECT") continue;
      el.addEventListener("change", () => reloadScript());
    }

    const versionInput = /** @type {HTMLInputElement|null} */ (
      document.getElementById("ctrl-version")
    );
    if (versionInput) {
      versionInput.addEventListener("blur", () => reloadScript());
      versionInput.addEventListener("keydown", (e) => {
        if (/** @type {KeyboardEvent} */ (e).key === "Enter") versionInput.blur();
      });
    }

    // -------------------------------------------------------------------------
    // Browser back / forward — re-sync controls and re-render
    // -------------------------------------------------------------------------
    window.addEventListener("popstate", () => {
      const params = new URLSearchParams(window.location.search);
      applyParamsToControls(params);
      reloadScript({ push: false });
    });

    // -------------------------------------------------------------------------
    // Copy button
    // -------------------------------------------------------------------------
    copyButton?.addEventListener("click", async () => {
      // textContent strips highlight.js spans, giving back plain script text.
      const scriptText = scriptCode?.textContent ?? "";
      if (!scriptText) return;
      try {
        await navigator.clipboard.writeText(scriptText);
        copyButton.textContent = "Copied!";
        setTimeout(() => { copyButton.textContent = "Copy script"; }, 1500);
      } catch {
        copyButton.textContent = "Copy failed";
        setTimeout(() => { copyButton.textContent = "Copy script"; }, 1500);
      }
    });
  </script>
</body>
</html>
